<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Schema evolution and snapshot-correct semantic deltas</title>
  <desc id="desc">A schema update advances the catalog epoch without invalidating old segments; exact metadata prunes safely, unknown metadata remains conservative, and tombstones preserve snapshot correctness.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; letter-spacing: 0; }
      .section { font: 700 17px Arial, sans-serif; fill: #334155; letter-spacing: 0; }
      .box-title { font: 700 19px Arial, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
      .box-text { font: 600 15px Arial, sans-serif; fill: #334155; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
      .small-text { font: 600 14px Arial, sans-serif; fill: #334155; text-anchor: middle; dominant-baseline: middle; letter-spacing: 0; }
      .old-box { fill: #ecfdf5; stroke: #15803d; stroke-width: 2; }
      .new-box { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; }
      .delete-box { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.3; }
      .compaction-box { fill: #f8fafc; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; }
      .rule-box { fill: #f8fafc; stroke: #64748b; stroke-width: 1.8; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #1d4ed8; stroke-width: 2.6; marker-end: url(#arrow-blue); }
      .arrow-orange { fill: none; stroke: #c2410c; stroke-width: 2.6; marker-end: url(#arrow-orange); }
      .arrow-dashed { fill: none; stroke: #64748b; stroke-width: 2.3; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .lane { fill: none; stroke: #e2e8f0; stroke-width: 1.5; }
      .dot { fill: #ffffff; stroke: #334155; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1040"/>
  <text class="title" x="70" y="58">Schema Evolution and Snapshot-Correct Deltas</text>
  <text class="subtitle" x="70" y="88">Add-label/add-property evolution keeps old storage valid; pruning remains evidence-based.</text>

  <text class="section" x="70" y="134">Timeline</text>
  <line class="lane" x1="70" y1="148" x2="1540" y2="148"/>
  <line x1="170" y1="206" x2="1430" y2="206" stroke="#cbd5e1" stroke-width="4"/>

  <g id="t1">
    <circle class="dot" cx="170" cy="206" r="9"/>
    <rect class="old-box" x="70" y="235" width="220" height="88" rx="10"/>
    <text class="box-title" x="180" y="260">t1 insert</text>
    <text class="box-text" x="180" y="286">KNOWS edge</text>
    <text class="box-text" x="180" y="306">schema_epoch=0</text>
  </g>
  <g id="t2">
    <circle class="dot" cx="485" cy="206" r="9"/>
    <rect class="new-box" x="375" y="235" width="220" height="88" rx="10"/>
    <text class="box-title" x="485" y="260">t2 schema update</text>
    <text class="box-text" x="485" y="286">ADD EDGE LABEL LIKES</text>
    <text class="box-text" x="485" y="306">catalog epoch=1</text>
  </g>
  <g id="t3">
    <circle class="dot" cx="800" cy="206" r="9"/>
    <rect class="new-box" x="690" y="235" width="220" height="88" rx="10"/>
    <text class="box-title" x="800" y="260">t3 insert</text>
    <text class="box-text" x="800" y="286">LIKES edge</text>
    <text class="box-text" x="800" y="306">schema_epoch=1</text>
  </g>
  <g id="t4">
    <circle class="dot" cx="1115" cy="206" r="9"/>
    <rect class="delete-box" x="1005" y="235" width="220" height="88" rx="10"/>
    <text class="box-title" x="1115" y="260">t4 delete</text>
    <text class="box-text" x="1115" y="286">old KNOWS edge</text>
    <text class="box-text" x="1115" y="306">tombstone epoch=1</text>
  </g>
  <g id="t5">
    <circle class="dot" cx="1430" cy="206" r="9"/>
    <rect class="compaction-box" x="1320" y="235" width="220" height="88" rx="10"/>
    <text class="box-title" x="1430" y="260">t5 compaction</text>
    <text class="box-text" x="1430" y="286">semantic re-layout</text>
    <text class="box-text" x="1430" y="306">lazy metadata repair</text>
  </g>

  <text class="section" x="70" y="392">Segment evidence</text>
  <line class="lane" x1="70" y1="406" x2="1540" y2="406"/>
  <g id="old-segment">
    <rect class="old-box" x="70" y="435" width="290" height="118" rx="10"/>
    <text class="box-title" x="215" y="462">Old exact segment</text>
    <text class="box-text" x="215" y="491">edge_type_set={KNOWS}</text>
    <text class="box-text" x="215" y="516">schema_epoch=0</text>
    <text class="box-text" x="215" y="538">valid storage</text>
  </g>
  <g id="new-segment">
    <rect class="new-box" x="545" y="435" width="290" height="118" rx="10"/>
    <text class="box-title" x="690" y="462">New segment</text>
    <text class="box-text" x="690" y="491">edge_type_set={LIKES}</text>
    <text class="box-text" x="690" y="516">schema_epoch=1</text>
    <text class="box-text" x="690" y="538">future writes use catalog</text>
  </g>
  <g id="tombstone-segment">
    <rect class="delete-box" x="860" y="435" width="290" height="118" rx="10"/>
    <text class="box-title" x="1005" y="462">Tombstone segment</text>
    <text class="box-text" x="1005" y="491">delete KNOWS</text>
    <text class="box-text" x="1005" y="516">schema_epoch=1</text>
    <text class="box-text" x="1005" y="538">needed for merge safety</text>
  </g>
  <g id="compacted-segment">
    <rect class="compaction-box" x="1230" y="435" width="290" height="118" rx="10"/>
    <text class="box-title" x="1375" y="462">Compacted segment</text>
    <text class="box-text" x="1375" y="491">metadata regenerated</text>
    <text class="box-text" x="1375" y="516">history retained</text>
    <text class="box-text" x="1375" y="538">until safe point</text>
  </g>

  <text class="section" x="70" y="625">Snapshot-visible results</text>
  <line class="lane" x1="70" y1="639" x2="1540" y2="639"/>
  <g id="snapshot-before">
    <rect class="rule-box" x="70" y="668" width="330" height="96" rx="10"/>
    <text class="box-title" x="235" y="695">Snapshot before t2</text>
    <text class="box-text" x="235" y="724">KNOWS visible</text>
    <text class="box-text" x="235" y="746">LIKES invisible</text>
  </g>
  <g id="snapshot-after-insert">
    <rect class="rule-box" x="530" y="668" width="330" height="96" rx="10"/>
    <text class="box-title" x="695" y="695">Snapshot after t3</text>
    <text class="box-text" x="695" y="724">KNOWS visible</text>
    <text class="box-text" x="695" y="746">LIKES visible</text>
  </g>
  <g id="snapshot-after-delete">
    <rect class="rule-box" x="990" y="668" width="330" height="96" rx="10"/>
    <text class="box-title" x="1155" y="695">Snapshot after t4</text>
    <text class="box-text" x="1155" y="724">KNOWS hidden</text>
    <text class="box-text" x="1155" y="746">LIKES visible</text>
  </g>

  <text class="section" x="70" y="824">Safety rules</text>
  <line class="lane" x1="70" y1="838" x2="1540" y2="838"/>
  <g id="rule-prune">
    <rect class="rule-box" x="70" y="865" width="335" height="90" rx="10"/>
    <text class="box-title" x="237" y="891">Exact-disjoint</text>
    <text class="box-text" x="237" y="920">old segment can prune</text>
    <text class="box-text" x="237" y="941">new-label queries</text>
  </g>
  <g id="rule-unknown">
    <rect class="rule-box" x="435" y="865" width="335" height="90" rx="10"/>
    <text class="box-title" x="602" y="891">Unknown or mixed</text>
    <text class="box-text" x="602" y="920">metadata must remain</text>
    <text class="box-text" x="602" y="941">conservative</text>
  </g>
  <g id="rule-tombstone">
    <rect class="rule-box" x="800" y="865" width="335" height="90" rx="10"/>
    <text class="box-title" x="967" y="891">Tombstones kept</text>
    <text class="box-text" x="967" y="920">they may suppress older</text>
    <text class="box-text" x="967" y="941">matching inserts</text>
  </g>
  <g id="rule-safe-point">
    <rect class="rule-box" x="1165" y="865" width="335" height="90" rx="10"/>
    <text class="box-title" x="1332" y="891">Compaction guarded</text>
    <text class="box-text" x="1332" y="920">collapse history only</text>
    <text class="box-text" x="1332" y="941">before safe point</text>
  </g>

  <path class="arrow-blue" d="M 485 323 L 690 435"/>
  <path class="arrow-blue" d="M 800 323 L 690 435"/>
  <path class="arrow-orange" d="M 1115 323 L 1005 435"/>
  <path class="arrow-dashed" d="M 1430 323 L 1375 435"/>
  <path class="arrow" d="M 215 553 L 235 668"/>
  <path class="arrow" d="M 690 553 L 695 668"/>
  <path class="arrow-orange" d="M 1005 553 L 1155 668"/>
  <path class="arrow-dashed" d="M 215 553 L 215 600 L 95 600 L 95 842 L 237 865"/>
  <path class="arrow-dashed" d="M 690 553 L 690 600 L 505 600 L 505 842 L 602 865"/>
  <path class="arrow-dashed" d="M 1005 553 L 1005 600 L 920 600 L 920 842 L 967 865"/>
  <path class="arrow-dashed" d="M 1375 553 L 1375 600 L 1505 600 L 1505 842 L 1332 865"/>

  <path class="arrow-dashed" d="M 290 279 L 375 279"/>
  <path class="arrow-blue" d="M 595 279 L 690 279"/>
  <path class="arrow-orange" d="M 910 279 L 1005 279"/>
  <path class="arrow-dashed" d="M 1225 279 L 1320 279"/>

  <rect class="rule-box" x="70" y="980" width="1520" height="34" rx="8"/>
  <text class="small-text" x="800" y="997">Scope: implemented add-label/add-property evolution; rename/drop/type-change migration remains future work.</text>
</svg>
