[package]
name = "lsmgraph-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "lsmgraph"
path = "src/lib.rs"

[[bin]]
name = "lsmgraph"
path = "src/bin/lsmgraph.rs"

[[bin]]
name = "p3-feedback-bench"
path = "src/bin/p3_feedback_bench.rs"

[dependencies]
anyhow = "1.0"
bytes = "1.7"
clap = { version = "4", features = ["derive"] }
csv = "1.3"
io-uring = { version = "0.7", optional = true }
libc = { version = "0.2", optional = true }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[features]
default = []
direct-io = ["dep:libc"]
uring = ["dep:io-uring", "dep:libc"]

[dev-dependencies]
tempfile = "3.10"
